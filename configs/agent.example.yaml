# Linux host agent only. Configure real absolute host paths before starting.
# Set OPS_AGENT_TOKEN in the environment (at least 24 random characters).
# Start on localhost or use a private authenticated TLS endpoint/tunnel.
state_dir: /var/lib/opssentinel-agent
services:
  web:
    compose_file: /srv/myapp/compose.yaml
    compose_service: web
    health_url: http://127.0.0.1:8080/health
    business_url: http://127.0.0.1:8080/ready
    allowed_actions:
      - restart_service
    # Rollback is opt-in, uses a locally available immutable image digest,
    # and requires explicit confirmation that data formats remain compatible.
    # expected_current_image: registry.example.com/myapp@sha256:<64 hexadecimal characters>
    # previous_image: registry.example.com/myapp@sha256:<different 64 hexadecimal characters>
    # rollback_data_compatible: true
    rollback_window_seconds: 600
    # Rollback requires both immutable digests, compatible data, a failing
    # business_url and the expected container Created timestamp in this window.
    # Add rollback_release to allowed_actions only after configuring all of these.
    # Dedicated application log only; do not use Docker's internal JSON logs.
    # managed_log_path: /srv/myapp/logs/agent-managed.log
    max_log_bytes: 10485760
    retained_log_count: 2
    # Add rotate_logs only for a log whose bounded copy-truncate is acceptable.
    # Optional known-good config recovery, disabled unless explicitly allowlisted.
    # Both files must be absolute, regular, non-symlink and at most 1 MiB.
    # managed_config_path: /srv/myapp/config/application.yaml
    # known_good_config_path: /srv/myapp/backups/application.known-good.yaml
    # known_good_config_sha256: <64 hexadecimal characters from the reviewed backup>
    # Add restore_config to allowed_actions only after reviewing the backup hash.
    # Original config is archived; fixed Compose config validation precedes a
    # --no-deps --no-build --pull never --force-recreate of only this service.
