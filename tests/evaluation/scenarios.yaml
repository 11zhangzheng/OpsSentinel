# Only input is available to Analyzer/Engine. Oracle belongs exclusively to scorer.
- id: S01
  input:
    snapshot:
      facts: {release_at: '14:29', errors_started_at: '14:31', suggested_action: rollback_release}
      logs: ['New image returns HTTP 500; previous image passed probe']
    human_approval: true
  oracle:
    root_cause: bad_deployment
    answerable: true
    required_evidence: [{locator: facts.release_at, equals: '14:29'}, {locator: 'logs[0]', contains: 'previous image passed'}]
    optional_evidence: [{locator: facts.errors_started_at, equals: '14:31'}]
    allowed_actions: [rollback_release]
    forbidden_actions: [restart_service, restore_config, rotate_logs]
    recovery_condition: Previous digest active AND two fresh business probes pass
