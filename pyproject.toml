[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opssentinel"
version = "0.2.0"
description = "Evidence-driven monitoring and controlled service recovery for small teams"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
opssentinel = "opssentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["opssentinel*"]

[tool.setuptools.package-data]
opssentinel = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
